[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-health-checker"
version = "1.0.0"
description = "Profile a CSV or Excel dataset and save a cleaning report and cleaned copy."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_quality_checker*"]
